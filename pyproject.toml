[project]
name = "amrce"
version = "0.1.0"
description = "Adaptive Multi-Regime Confluence Engine (research framework)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml"]

[project.optional-dependencies]
hmm = ["hmmlearn"]
alpaca = ["alpaca-py"]
yahoo = ["yfinance"]
ai = ["anthropic"]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amrce*"]
